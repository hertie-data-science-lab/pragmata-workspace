[lint.per-file-ignores]
# E402: every script in scripts/ inserts scripts/lib on sys.path before importing the
# workspace lib, and the annotation scripts call ws.load_env() before importing pragmata
# so .env is loaded first. Both are imports after code, by design.
#
# BLE001: these are glue scripts around a live service. Catching bare Exception around a
# per-item network call, logging it and carrying on is the deliberate resilience pattern -
# one failed domain must not abort a nightly run - so it is codified here rather than
# marked on a dozen individual handlers.
"scripts/**" = ["E402", "BLE001"]
