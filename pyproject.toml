[project]
name = "pragmata-workspace"
version = "0.0.0"
description = "Operational glue for the BSt annotation and eval pipelines."
requires-python = ">=3.12,<3.13"

# Direct dependencies only - everything else is transitive and pinned in uv.lock.
#
# pragmata is git-pinned to an exact SHA, not a branch: `pin/annotation-2026-07-01`
# exists only to keep that commit reachable. This is the ANNOTATION pin - the code
# that imported and annotated the live Argilla instance. It is deliberately frozen;
# moving it would change export behaviour on a live dataset.
#
# The EVAL side runs a different pragmata commit and cannot be expressed here: two
# versions of one package cannot coexist in one venv. It stays an environment pin
# (PRAGMATA_EVAL_SRC in .env) shadowed onto PYTHONPATH at call time - see
# scripts/lib/workspace.py:eval_pragmata() and docs/eval.md. Do not "simplify" it away.
#
# Extras: annotation -> argilla; querygen -> sentence-transformers; openai ->
# langchain-openai (Azure OpenAI is reached through the OpenAI-compatible surface).
dependencies = [
    "pragmata[annotation,querygen,openai] @ git+ssh://git@github.com/bertelsmannstift/pragmata.git@94e821965eaa7f3cc7a4951d35e1603604dd48f0",
    # Imported directly by scripts/ rather than reached through pragmata.
    "pandera[pandas]>=0.31,<1.0",  # eval scoring; the one extra the eval module needs
    "pandas>=3.0,<4.0",
    "matplotlib>=3.10,<4.0",       # annotation-report-plots
    "httpx>=0.28,<1.0",
    "pyyaml>=6.0,<7.0",
    # corpus_catalog.py / vectorstore_inventory.py: the publikationsbot vector store
    # (Postgres + pgvector) and the fairness audit's author-name lookup. Leaf packages -
    # nothing depends on them and they depend on nothing, so they cannot move the
    # numpy/scipy pins the alpha bootstrap runs on.
    "psycopg2-binary>=2.9,<3.0",
    "gender-guesser>=0.4,<1.0",
]

[dependency-groups]
dev = ["ruff>=0.16,<1.0"]  # the commit/push hooks run this

# The workspace is a set of scripts, not an importable library: there is nothing to
# build or install, so uv manages the environment without packaging the project.

[tool.ruff.lint.per-file-ignores]
# E402: every script in scripts/ inserts scripts/lib on sys.path before importing the
# workspace lib, and the annotation scripts call ws.load_env() before importing pragmata
# so .env is loaded first. Both are imports after code, by design.
#
# BLE001: these are glue scripts around a live service. Catching bare Exception around a
# per-item network call, logging it and carrying on is the deliberate resilience pattern -
# one failed domain must not abort a nightly run - so it is codified here rather than
# marked on a dozen individual handlers.
"scripts/**" = ["E402", "BLE001"]

# --- environment freeze -------------------------------------------------------
# Exact versions of the environment that produced the shipped report deliverables
# (reports/eval/2026-07-30/, pinned by hash in reproducibility/2026-07-30-eval-report/).
#
# Why constraints and not a bare `uv lock`: a fresh resolution moves numpy, scipy and
# pandas, and the alpha bootstrap (1000 resamples, seed 0) runs on top of them. The
# bundle's promise is that a re-run re-derives the same numbers, so the environment is
# part of the pin, not an implementation detail.
#
# GENERATED from `uv pip freeze` on 2026-07-31; edit by regenerating, not by hand.
# To take an upgrade deliberately: change the entries you want, `uv lock`, re-run the
# eval targets into a scratch OUT=, and diff the CSVs before accepting.
[tool.uv]
package = false
